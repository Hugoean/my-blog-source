name: Daily paper publish

on:
  workflow_dispatch:
  schedule:
    # 17:30 Asia/Shanghai
    - cron: "30 9 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish one queued paper
        run: python3 tools/publish_next_paper.py

      - name: Build Hexo site
        run: npm run build

      - name: Commit queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_queue source/papers-reader
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "chore: publish next paper"
            git push
          fi

      - name: Deploy to personal homepage
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          test -n "$GH_PAGES_TOKEN"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_PAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
          npm run deploy
